<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Tracker</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">

      <span class="navbar-brand mb-0 h1">
        Expense Tracker
      </span>

      <button
        id="themeToggle"
        type="button"
        class="btn btn-outline-light theme-toggle"
        title="Toggle dark mode"
        aria-label="Toggle dark mode"
      >
        <i class="bi bi-moon-fill"></i>
      </button>

    </div>
  </nav>

  <main class="container py-4">

    <!-- Alert -->
    <div id="alertContainer"></div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center my-4 d-none">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Summary Cards -->
    <section class="mb-4">
      <div class="summary-grid">

        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Total Amount</h5>
            <p id="totalAmount" class="fs-3 mb-0">$0.00</p>
          </div>
        </div>

        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Number of Expenses</h5>
            <p id="expenseCount" class="fs-3 mb-0">0</p>
          </div>
        </div>

        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Highest Expense</h5>
            <p id="highestExpense" class="fs-3 mb-0">$0.00</p>
          </div>
        </div>

      </div>
    </section>

    <!-- Expense Chart -->
    <section class="card mb-4">
      <div class="card-body">

        <h2 class="h4 mb-3">Expenses by Category</h2>

        <div class="chart-container">
          <canvas id="expenseChart"></canvas>
        </div>

      </div>
    </section>

    <!-- Add Expense Form -->
    <section class="card mb-4">
      <div class="card-body">

        <h2 class="h4 mb-3">Add Expense</h2>

        <form id="expenseForm">

          <div class="row g-3">

            <div class="col-md-6">
              <label for="title" class="form-label">
                Title
              </label>

              <input
                type="text"
                class="form-control"
                id="title"
                required
              >
            </div>

            <div class="col-md-6">
              <label for="amount" class="form-label">
                Amount
              </label>

              <input
                type="number"
                class="form-control"
                id="amount"
                min="0.01"
                step="0.01"
                required
              >
            </div>

            <div class="col-md-6">
              <label for="category" class="form-label">
                Category
              </label>

              <select
                class="form-select"
                id="category"
                required
              >
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="date" class="form-label">
                Date
              </label>

              <input
                type="date"
                class="form-control"
                id="date"
                required
              >
            </div>

          </div>

          <div class="text-center mt-3">
            <button
              type="submit"
              class="btn btn-primary"
            >
              <i class="bi bi-plus-lg"></i>
              Add Expense
            </button>
          </div>

        </form>

      </div>
    </section>

    <!-- Search and Filter -->
    <section class="mb-4">

      <div class="row g-3">

        <div class="col-md-8">
          <label for="searchInput" class="form-label">
            Search Expenses
          </label>

          <div class="input-group">

            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>

            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Search by title or category..."
            >

          </div>
        </div>

        <div class="col-md-4">
          <label for="categoryFilter" class="form-label">
            Filter by Category
          </label>

          <select
            id="categoryFilter"
            class="form-select"
          >
            <option value="All">All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

      </div>

    </section>

    <!-- Export CSV -->
    <div class="d-flex justify-content-end mb-3">
      <button
        id="exportCsvBtn"
        type="button"
        class="btn btn-success"
      >
        <i class="bi bi-download"></i>
        Export CSV
      </button>
    </div>

    <!-- Expenses Table -->
    <section>
      <div class="table-responsive">

        <table class="table table-striped table-bordered align-middle">

          <thead class="table-dark">
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="expensesTableBody">
            <!-- Rows will be created by JavaScript -->
          </tbody>

        </table>

      </div>
    </section>

  </main>

  <!-- Edit Expense Modal -->
  <div
    class="modal fade"
    id="editExpenseModal"
    tabindex="-1"
    aria-hidden="true"
  >
    <div class="modal-dialog">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">
            Edit Expense
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>

        </div>

        <div class="modal-body">

          <form id="editExpenseForm">

            <input
              type="hidden"
              id="editExpenseId"
            >

            <div class="mb-3">
              <label for="editTitle" class="form-label">
                Title
              </label>

              <input
                type="text"
                class="form-control"
                id="editTitle"
                required
              >
            </div>

            <div class="mb-3">
              <label for="editAmount" class="form-label">
                Amount
              </label>

              <input
                type="number"
                class="form-control"
                id="editAmount"
                min="0.01"
                step="0.01"
                required
              >
            </div>

            <div class="mb-3">
              <label for="editCategory" class="form-label">
                Category
              </label>

              <select
                class="form-select"
                id="editCategory"
                required
              >
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="editDate" class="form-label">
                Date
              </label>

              <input
                type="date"
                class="form-control"
                id="editDate"
                required
              >
            </div>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Save Changes
            </button>

          </form>

        </div>

      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom JS -->
  <script src="js/app.js"></script>

</body>

</html>
